name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Need to read the repo to check it out and run the scanner against it.
  contents: read

jobs:
  test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --release

      - name: cargo test
        run: cargo test --release

      - name: cargo clippy
        run: cargo clippy --release -- -D warnings

  docker-smoke:
    # Build the production Dockerfile on every PR so a broken image can
    # never make it to a release tag silently. The release.yml multi-arch
    # build runs on tag push only; this catches breakage at PR time on
    # the cheaper single-arch path.
    name: Docker image smoke build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: warden:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke run --version
        run: |
          set -euo pipefail
          out=$(docker run --rm warden:ci-smoke --version)
          echo "$out"
          # Cargo.toml version must match the binary's reported version.
          want=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$out" = "warden $want"

      - name: Smoke run rules
        run: |
          docker run --rm warden:ci-smoke rules | head -5
