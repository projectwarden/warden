name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Tag pushes are not concurrent in practice but the rule expects a block.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Required to publish a GitHub release with attached binaries.
  contents: write
  # Required to push the multi-arch image to ghcr.io.
  packages: write
  # Required for OIDC trusted publishing (sigstore / cosign attestations).
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: warden-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: warden-linux-aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            asset: warden-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: warden-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: warden-windows-x86_64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (aarch64-linux)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"\n' > .cargo/config.toml

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/warden dist/warden
          cp README.md LICENSE CHANGELOG.md dist/
          tar -C dist -czf ${{ matrix.asset }} .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/warden.exe" "dist/warden.exe"
          Copy-Item README.md,LICENSE,CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to create the GitHub release and upload the build artifacts.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} upload/ \;
          (cd upload && sha256sum * > SHA256SUMS)
          ls -la upload

      - name: Extract release notes for this tag from CHANGELOG.md
        run: |
          # Pull the section between "## v<TAG>" and the next "## v" header.
          # If the section is empty, fall back to a one-line generic body.
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ "^## "ver { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "warden ${GITHUB_REF_NAME}" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: upload/*
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # Skip on any pre-release tag (rc, alpha, beta) so they don't burn a real
    # crates.io version. Only stable v1.0.0-style tags publish.
    if: ${{ !contains(github.ref_name, '-') }}
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable

      - name: Verify Cargo.toml version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "ERROR: tag $tag_version != Cargo.toml $cargo_version" >&2
            exit 1
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  # Docker is split across native runners for speed: arm64 builds natively on
  # ubuntu-24.04-arm instead of running under QEMU on an amd64 host (~5x faster).
  # Each per-platform job pushes a digest-only reference via push-by-digest mode,
  # then the manifest job combines them into the final :<ver> and :latest tags.
  docker-build:
    name: Build and push Docker image (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read   # repo checkout
      packages: write  # push image blobs to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/warden" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Merge Docker manifests
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${{ github.repository_owner }}/warden"
          digests=$(printf "${image}@sha256:%s " *)
          # Version tag
          docker buildx imagetools create \
            -t "${image}:${{ steps.version.outputs.version }}" \
            ${digests}
          # latest tag (only on stable releases, skip for pre-releases)
          if [[ ! "${{ github.ref_name }}" =~ - ]]; then
            docker buildx imagetools create \
              -t "${image}:latest" \
              ${digests}
          fi

      - name: Inspect final image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/warden"
          docker buildx imagetools inspect "${image}:${{ steps.version.outputs.version }}"
