[package]
name = "wardenscan"
version = "1.0.0"
edition = "2021"
description = "CI/CD security scanner for GitHub Actions workflows"
license = "MIT"
repository = "https://github.com/projectwarden/warden"
readme = "README.md"
keywords = ["github-actions", "security", "scanner", "ci-cd", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "warden"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
colored = "2"
anyhow = "1"
toml = "0.8"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
